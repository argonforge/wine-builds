name: Build Wine

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v11.0)'
        required: true
        default: 'v11.0'
      draft:
        description: 'Create draft release'
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  DRAFT: ${{ inputs.draft || 'false' }}
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: 'true'
  LLVM_MINGW_VERSION: '20260922'

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - ver: v3
            flags: -march=x86-64-v3 -mtune=znver3 ${{ vars.FLAGS }}
          - ver: v4
            flags: -march=x86-64-v4 -mtune=znver4 ${{ vars.FLAGS }}
    runs-on: self-hosted
    timeout-minutes: 90
    container:
      image: nafigat0r/devuan:6-dev
    env:
      OPT_FLAGS: ${{ matrix.flags }}
      CCACHE_DIR: /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}/.ccache-${{ matrix.ver }}
    steps:
      - name: Compute version variables
        run: |
          WINE_VERSION="${TAG#v}"
          echo "WINE_VERSION=$WINE_VERSION" >> $GITHUB_ENV
          echo "Using WINE_VERSION=$WINE_VERSION"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-wine-clang-mingw-${{ matrix.ver }}-${{ github.sha }}
          restore-keys: |
            ccache-wine-clang-mingw-${{ matrix.ver }}-

      - name: Configure ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --max-size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache -s

      - name: Install llvm-mingw
        run: |
          LLVM_MINGW_URL="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          wget -q --show-progress "$LLVM_MINGW_URL" -O /tmp/llvm-mingw.tar.xz
          mkdir -p /opt/llvm-mingw
          tar -xJf /tmp/llvm-mingw.tar.xz -C /opt/llvm-mingw --strip-components=1
          rm /tmp/llvm-mingw.tar.xz

          # Add to PATH
          echo "/opt/llvm-mingw/bin" >> "$GITHUB_PATH"

          # Verify
          echo "--- llvm-mingw x86_64 clang ---"
          /opt/llvm-mingw/bin/x86_64-w64-mingw32-clang --version | head -3
          echo "--- llvm-mingw i686 clang ---"
          /opt/llvm-mingw/bin/i686-w64-mingw32-clang --version | head -3
          echo "--- lld-link ---"
          /opt/llvm-mingw/bin/lld-link --version | head -3

      - name: Download Wine source
        run: |
          WINE_MAJOR="$(echo "$WINE_VERSION" | cut -d. -f1)"
          WINE_MINOR="$(echo "$WINE_VERSION" | cut -d. -f2)"
          if [ "$WINE_MINOR" = "0" ]; then
            WINE_URL_VERSION="${WINE_MAJOR}.0"
          else
            WINE_URL_VERSION="${WINE_MAJOR}.x"
          fi
          wget -q --show-progress \
            "https://dl.winehq.org/wine/source/${WINE_URL_VERSION}/wine-${WINE_VERSION}.tar.xz"
          tar xf "wine-${WINE_VERSION}.tar.xz"
          echo "Source extracted: wine-${WINE_VERSION}"
          rm "wine-${WINE_VERSION}.tar.xz"

      - name: Configure Wine
        working-directory: wine-${{ env.WINE_VERSION }}
        env:
          # Unix part: system Clang with ccache
          CC: ccache clang
          CXX: ccache clang++
          CFLAGS: ${{ env.OPT_FLAGS }}
          CXXFLAGS: ${{ env.OPT_FLAGS }}
          LDFLAGS: -fuse-ld=lld -Wl,-O1,--sort-common,--as-needed

          # Cross part: llvm-mingw Clang with ccache
          CROSSCC: ccache x86_64-w64-mingw32-clang
          CROSSCXX: ccache x86_64-w64-mingw32-clang++
          CROSSCFLAGS: ${{ env.OPT_FLAGS }}
          CROSSCXXFLAGS: ${{ env.OPT_FLAGS }}
          CROSSLDFLAGS: -fuse-ld=lld
        run: |
          ./configure \
            --enable-archs=i386,x86_64 \
            --disable-winemenubuilder \
            --disable-win16 \
            --disable-tests \
            --without-oss \
            --prefix=/opt/wine-${WINE_VERSION}

      - name: Build Wine
        working-directory: wine-${{ env.WINE_VERSION }}
        run: |
          make -j$(nproc)

      - name: Install Wine
        working-directory: wine-${{ env.WINE_VERSION }}
        run: |
          make install

      - name: Package Wine
        run: |
          BUILD_NAME="wine-${WINE_VERSION}-wow64-x86-64-${{ matrix.ver }}"
          ARCHIVE_NAME="${BUILD_NAME}.tar.xz"
          mv "/opt/wine-${WINE_VERSION}" "/opt/${BUILD_NAME}"
          rm -rf "/opt/${BUILD_NAME}/include" \
                 "/opt/${BUILD_NAME}/share/applications" \
                 "/opt/${BUILD_NAME}/share/man"
          cd /opt
          tar -cJf "${GITHUB_WORKSPACE}/${ARCHIVE_NAME}" "${BUILD_NAME}"
          ls -lh "${GITHUB_WORKSPACE}/${ARCHIVE_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wine-wow64-${{ matrix.ver }}
          path: ./*.tar.xz
          retention-days: ${{ env.DRAFT == 'true' && 1 || 5 }}

      - name: Show ccache stats
        if: always()
        run: ccache -s

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WINE_VERSION="${TAG#v}"
          FLAGS=(--latest)
          [[ $DRAFT = true ]] && FLAGS=(--draft)

          TITLE="${WINE_VERSION} (Clang)"
          [[ $DRAFT = true ]] && TITLE="[DRAFT] $TITLE"

          ls -lh artifacts/

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - uploading files"
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              artifacts/*.tar.xz
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target ${{ github.sha }} \
              --title "$TITLE" \
              --notes-file .github/release-notes.md \
              "${FLAGS[@]}" \
              artifacts/*.tar.xz
          fi
